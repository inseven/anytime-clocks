[package]
name = "nezumi"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.40"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4.5"
rand = "0.10.0"
raylib = { version = "6.0", features = ["opengl_21"] }
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"

[package.metadata.deb]
maintainer = "Jason Morley <support@jbmorley.co.uk>"
copyright = "1997-2026 Jason Morley, Shawn Leedy"
assets = [
  ["target/release/nezumi", "usr/bin/", "755"],
  ["states.json", "/usr/share/nezumi/states.json", "644"],
  ["frames/*", "/usr/share/nezumi/frames", "644"],
]
