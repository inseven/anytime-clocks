[tools]

cmake = "4.5.1"
gh = "2.106.0"
python = "3.15.2"
rust = "latest"
uv = "latest"

"pipx:changes-semver" = "6.0.9"
"pipx:check-jsonschema" = "0.39.0"
"pipx:inseven-build-tools" = "1.3.3"
"cargo:cargo-deb" = "latest"

[env]

MISE_CARGO_HOME = "{{config_root}}/.mise/share/cargo"
MISE_RUSTUP_HOME = "{{config_root}}/.mise/share/rustup"

UV_CACHE_DIR = "{{config_root}}/.mise/share/uv"

UV_PYTHON_PREFERENCE = "only-system"
