[tools]

cmake = "4.4.4"
gh = "2.102.0"
python = "3.15.0"
rust = "latest"
uv = "latest"

"pipx:changes-semver" = "6.0.8"
"pipx:check-jsonschema" = "0.38.2"
"pipx:inseven-build-tools" = "1.3.1"
"cargo:cargo-deb" = "latest"

[env]

MISE_CARGO_HOME = "{{config_root}}/.mise/share/cargo"
MISE_RUSTUP_HOME = "{{config_root}}/.mise/share/rustup"

UV_CACHE_DIR = "{{config_root}}/.mise/share/uv"

UV_PYTHON_PREFERENCE = "only-system"
